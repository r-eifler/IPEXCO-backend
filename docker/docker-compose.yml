version: "3"
services:
  IPEXCO:
    container_name: ipexco
    restart: always
    image: eifler/ipexco:latest
    volumes:
      - <absolute path to folder to store uploaded and generated files>:/usr/src/app/dist/out-tsc/data
    ports:
      - "3000:3000"
    env_file:
        - backend.env

  PLANNER:
    container_name: planner
    restart: always
    image: eifler/planner-service:latest
    ports:
      - "3333:3333"
    env_file:
        - planner.env

  EXPLAINER:
    container_name: explainer
    restart: always
    image: eifler/explainer-service:latest
    ports:
      - "3334:3334"
    env_file:
        - explainer.env

  MONGO:
    container_name: mongodb
    restart: always
    image: mongo
    volumes:
      - <absolute path to folder to store database data>:/data/db
    ports:
      - "27017:27017"
